<!DOCTYPE html>
<html lang="de">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Termine Filtern</title>
      <link rel="stylesheet" href="style.css">
   </head>
   <body>
      <div class="wrapper">
         <!-- Sidebar -->
         <aside id="sidebar" class="sidebar">
            <ul>
               <li><a href="termineFiltern.html" class="active">Termine Filtern</a></li>
               <li><a href="termineBearbeiten.html">Termine Bearbeiten</a></li>
               <li><a href="termineTracking.html">Termine Tracking</a></li>
            </ul>
         </aside>
         <!-- Main content -->
         <div class="container" id="container">
		             <div class="toggle-btn">
               <button id="toggleSidebar">☰</button>
            </div>
            <div id="notification" class="notification" style="display: none;"></div>
            <!-- Excel-Datei hochladen -->


<div class="upload-section">
    <h2>Excel-Datei hochladen (Termine Filtern)</h2>
    <input type="file" id="fileInput" accept=".xlsx, .xls" >
</div>




            <div class="tables-section">
               <div>
                  <h2>Gefilterte Termine (Bleiben)</h2>
                  <table id="gefiltert-tabelle" ondragover="allowDrop(event)" ondrop="drop(event, 'gefiltert')">
                     <thead>
                        <tr>
                           <th>Uhrzeit</th>
                           <th>Patient Name</th>
                           <th>Arzt Name</th>
                           <th>Bemerkung</th>
                           <th>Ort</th>
                        </tr>
                     </thead>
                     <tbody id="gefiltert-tbody">
                        <!-- Dynamische Inhalte -->
                     </tbody>
                  </table>
               </div>
               <div>
                  <h2>Herausgefilterte Termine (Entfernt)</h2>
                  <table id="entfernt-tabelle" ondragover="allowDrop(event)" ondrop="drop(event, 'entfernt')">
                     <thead>
                        <tr>
                           <th>Uhrzeit</th>
                           <th>Patient Name</th>
                           <th>Arzt Name</th>
                           <th>Bemerkung</th>
                           <th>Ort</th>
                        </tr>
                     </thead>
                     <tbody id="entfernt-tbody">
                        <!-- Dynamische Inhalte -->
                     </tbody>
                  </table>
               </div>
            </div>
            <!-- Aktionen -->
            <div class="action-section">
               <button onclick="saveToExcel()">Änderungen speichern</button>
            </div>
         </div>
      </div>
      <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
      <script src="termineFilternApp.js"></script>
      <script>
         const sidebar = document.getElementById('sidebar');
         const container = document.getElementById('container');
         const toggleBtn = document.getElementById('toggleSidebar');

         toggleBtn.addEventListener('click', function () {
            sidebar.classList.toggle('active');
            container.classList.toggle('expanded');
         });
      </script>
	  
	
    
   </body>
</html>
